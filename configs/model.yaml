seed: 42
device: "cpu"   # 如有 CUDA 可改为 "cuda"

vis:
  dump_node_importance: true           # 打开导出开关
  source: "teacher"                    # "teacher" 用 BPN 老师分布；"model" 用 NodeImportanceHead 输出
  # endpoints: ["EP_A", "EP_B"]          # 只导出这两个 endpoint（留空表示导出所有）
  outdir: "results/vis/node_importance"  # 可选；不写则默认在 data/processed/vis_node_importance 下

train:
  epochs: 20
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 1.0e-4

model:
  gnn_hidden: 64
  gnn_layers: 3
  cnn_channels: [16, 32]
  fusion_hidden: 64
  # 旧版开关，为兼容保留；真正行为由 endpoint_conditioning.mode 决定
  use_endpoint_condition: true
  endpoint_dim: 16

  # 新增：端点条件化模式
  endpoint_conditioning:
    # 可选: none | id | teacher_pool | hybrid
    mode: teacher_pool
    d_ep: 16        # 仅 id / hybrid 下的 ID embedding 维度
    dropout: 0.3    # 仅 id / hybrid 下，对 ID embedding 的 dropout

loss:
  use_cpl: false
  cpl_weight: 0.0
  mse_weight: 1.0

data:
  dataset_npz: "data/processed/my_design.npz"
  vocab_json:  "data/processed/vocab.json"
  train_split: 0.8
  val_split: 0.2

# BPN 配置
bpn:
  # —— 离线 BPN 分析（供 src/training/train_cpl_bpn.py 使用） ——
  use_bpn: false           # 保持原有行为
  steps_fwd: 6
  steps_bwd: 6
  decay_fwd: 0.9
  decay_bwd: 0.9
  combine: hadamard       # hadamard | sum
  out_norm: l1            # l1 | l2 | max
  degree_norm: out        # out | in
  include_seed: true
  topk: 5
  max_endpoints: 10       # 日志里最多打印多少个端点的 topK
  save_maps: true

  # —— 训练融合：BPN 辅助监督（供 src/training/train_cpl.py 使用） ——
  use_bpn_in_loss: true  # E1/E0 先关掉；E2/E3 设为 true
  bpn_loss_type: kl       # kl | mse | l1
  bpn_loss_weight: 0.1    # base 辅助 loss 的权重
  temperature: 1.0        # 节点重要性 head 的 softmax 温度
  importance_npz: null    # null 时自动推导为 <dataset>_bpn_importance.npz
  ablation: none          # none | shuffle | random（老师分布扰动）
  ablation_seed: 123
  warmup_epochs: 4       # BPN loss 预热 epoch 数（权重=0）
  ramp_epochs: 8         # 从 0 线性爬升到 bpn_loss_weight 的 epoch 数
  use_nuiat_softmax: true
  nuiat_temperature: 0.05
  
# 供 train_cpl_bpn.py 解析数据集路径使用
dataset_path: data/processed/my_design.npz
project_root: .
design: my_design

debug:
  limit_train_samples: 0   # >0 时裁剪训练样本数做过拟合体检